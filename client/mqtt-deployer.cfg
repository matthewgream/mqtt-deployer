# mqtt-deployer — sample device config (lift-and-shift starting point).
#
# Copy to the device, edit the [deployer] block for your broker/arch/prefix, and
# add one [profile:...] per artifact you want under deployment control. The
# profile NAME is the key used everywhere (config, meta topic, deploy command) —
# keep it stable. Validate with: mqtt-deployer --check <this-file>

[deployer]
broker       = master.example.net      ; the fleet/firmware master broker
port         = 8883
tls          = true
cafile       = /usr/local/share/ca/fleet-ca.crt
username     = fleet
password     = changeme
arch         = armv6                    ; armv6 | aarch64 | esp32 … (never "armhf")
prefix       = myfleet/firmware         ; topic namespace root
status-topic = myfleet/status/%mac%     ; %mac% / %host% substituted; retained inventory
client-id    = mqtt-deployer-%mac%
;macid       = aabbccddeeff             ; OPTIONAL: override the derived MAC (this device's
                                        ; per-machine identity / which meta/<macid> it reads)
retry-normal = 10800                    ; seconds; backoff after a failed apply
retry-urgent = 300                      ; used when a meta entry has type=urgent
jitter       = 0                        ; random pre-apply delay (avoid a fleet-wide herd)
;pubkey      = <base64>                 ; OPTIONAL ed25519 pubkey (inline base64, 32 raw
                                        ; bytes; paste the line `mqtt-deploy-keygen` prints).
                                        ; Present => signatures ENFORCED (fail-closed).

# A BINARY — "busy" while its service runs, so stop / swap / start. Seated 0755,
# verified by running the candidate (catches wrong-arch / corrupt before it goes live).
[profile:myapp]
file         = /opt/system/data/myapp
mode         = 0755
service      = myapp
verify       = %candidate% --check /etc/default/myapp
on-fail      = rollback                 ; rollback | retry | leave
retain-bak   = true

# A CONFIG — live-replace (swap while running, restart to reload). Push the binary
# FIRST so this verify can run the seated binary against the candidate config.
[profile:myapp-cfg]
file         = /opt/system/data/myapp.cfg
service      = myapp
verify       = /opt/system/data/myapp --check %candidate%
live-replace = true
on-fail      = rollback
retain-bak   = true

# A PER-DEVICE artifact — only honoured from THIS device's per-machine stream
# (<prefix>/<arch>/meta/<macid>); a global push of this profile is ignored. Use
# for per-box identity/config that must not be clobbered fleet-wide.
[profile:myapp-id]
file         = /opt/system/data/myapp-id.cfg
service      = myapp
verify       = /opt/system/data/myapp --check %candidate%
live-replace = true
machine-specific = true
on-fail      = rollback
retain-bak   = true

# A SCRIPT — no service; syntax-checked (not executed) as the verify.
[profile:diag]
file         = /opt/system/data/diag.sh
mode         = 0755
verify       = /bin/sh -n %candidate%
on-fail      = rollback
retain-bak   = true
