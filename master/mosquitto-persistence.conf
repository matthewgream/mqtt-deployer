# mqtt-deployer — keep retained firmware meta + blobs across broker restarts.
# Install to /etc/mosquitto/conf.d/ on the fleet master. It is processed after
# the stock "persistence false" line, so it wins.
persistence true
persistence_location /var/lib/mosquitto/
# flush retained store to disk quickly after a deploy (seconds), so a master
# reboot right after "make dist" doesn't lose the just-published artifacts.
autosave_interval 20
